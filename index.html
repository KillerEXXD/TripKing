<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- API origin — preconnect cuts the DNS+TLS handshake off the first /auth/me call
         (~150-300ms on 4G), shrinking the LCP path for every authed page. The CDN domain
         (api.tripkingapp.com) and the direct Supabase host are both included since the env
         decides which we hit at runtime. -->
    <link rel="preconnect" href="https://api.tripkingapp.com" crossorigin />
    <link rel="preconnect" href="https://saxcbebqxgatiktsebxw.supabase.co" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trip King" />
    <meta name="theme-color" content="#10b981" />

    <!-- Social share preview (WhatsApp / Telegram / etc.) — add /public/og-image.png (1200×630) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Trip King — post a trip, verified drivers come to you" />
    <meta property="og:description" content="Stop chasing drivers in WhatsApp groups. Post a trip, pick a verified driver, track it live. Built for travel agents." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Trip King — post a trip, verified drivers come to you" />
    <meta name="twitter:description" content="Stop chasing drivers in WhatsApp groups. Post a trip, pick a verified driver, track it live." />
    <meta name="twitter:image" content="/og-image.png" />

    <title>Trip King — Cab & Trip Marketplace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
