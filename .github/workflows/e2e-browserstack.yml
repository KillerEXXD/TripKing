name: Playwright E2E — BrowserStack (real devices, watchable)

# Click-to-run, runs the Playwright suite on REAL devices in BrowserStack's cloud
# (iOS Safari + Android Chrome + macOS Chrome by default — edit browserstack.yml).
# QA opens the BrowserStack dashboard URL printed in the run log and WATCHES tests
# drive a real phone in real time. Video + network log + console errors recorded
# per session and downloadable for failed-test triage.
#
# Why a separate workflow from e2e-qase.yml:
#  - BrowserStack uses paid session minutes — we don't want to burn them on every PR
#  - manual-trigger only by default; opt into nightly via the schedule below if desired
on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Test name filter (substring). Empty = run everything.'
        required: false
        default: 'referral-qase-demo'
      post_to_qase:
        description: 'Post results to Qase + auto-create defects on failure.'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  bs:
    name: BrowserStack Automate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_BUILD_NAME: 'TripKing #${{ github.run_number }} (${{ github.ref_name }})'
      QASE_TESTOPS_API_TOKEN: ${{ (inputs.post_to_qase != false) && secrets.QASE_TESTOPS_API_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # The BS SDK wraps the Playwright command. It boots the BrowserStack Local tunnel
      # (so the local dev server on :4399 is reachable), spins up the real-device sessions
      # in parallel, and ships each test's result + video to the dashboard.
      # The wrapper auto-installs the right Playwright drivers — no `npx playwright install` needed.
      - name: Run Playwright on BrowserStack
        run: |
          npx browserstack-node-sdk playwright test \
            ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }} \
            --reporter=list
        env:
          CI: 'true'

      - name: Print BrowserStack dashboard URL
        if: always()
        run: |
          echo "### BrowserStack run" >> $GITHUB_STEP_SUMMARY
          echo "- Build name: \`$BROWSERSTACK_BUILD_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- Filter:     \`${{ inputs.grep || '(all)' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Dashboard (videos + logs + replay): [app.browserstack.com](https://automate.browserstack.com/dashboard/v2/builds/)" >> $GITHUB_STEP_SUMMARY
          echo "- 🐞 Failed tests → Qase Defect → /administration/bugs (within 5 min)" >> $GITHUB_STEP_SUMMARY
