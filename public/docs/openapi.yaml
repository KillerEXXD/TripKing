  /debug:
    get: { tags: [debug], summary: 'List the debug routes (admin; Bearer) — data is { routes: [...] }', responses: { '200': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' } } }
  /debug/throw:
    get: { tags: [debug], summary: 'Deliberately throw an uncaught error (admin; Bearer) — withTiming reports it to Sentry (tags: source=edge-fn, fn=debug) and returns { code: "INTERNAL" } with status 500 (never a raw runtime error). Exercises the L5 edge-function error boundary.', responses: { '500': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' } } }
  /debug/fail:
    get: { tags: [debug], summary: 'Return a fail(code, …) envelope (admin; Bearer) — ?code=<CODE> picks the code (default CONFLICT) and a sensible HTTP status; no Sentry event.', parameters: [{ name: code, in: query, schema: { type: string, enum: [VALIDATION, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, DB_ERROR, INTERNAL] } }], responses: { '400': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' }, '404': { $ref: '#/components/responses/Envelope' }, '409': { $ref: '#/components/responses/Envelope' }, '422': { $ref: '#/components/responses/Envelope' }, '429': { $ref: '#/components/responses/Envelope' }, '500': { $ref: '#/components/responses/Envelope' } } }
  /debug/slow:
    get: { tags: [debug], summary: 'Sleep then return 200 (admin; Bearer) — ?ms=<n> (default 1000, max 10000); data is { slept_ms }.', parameters: [{ name: ms, in: query, schema: { type: integer, default: 1000, minimum: 0, maximum: 10000 } }], responses: { '200': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' } } }
  /passengers:
    get: { tags: [passengers], summary: 'List the passenger directory (admin; Bearer) — newest-registered first by default; joins referred_by:users!referred_by_user_id(id, display_name, role, phone). Pagination via meta.', parameters: [{ name: q, in: query, schema: { type: string }, description: 'case-insensitive substring match against name OR phone' }, { name: sort, in: query, schema: { type: string }, description: '<col>[:asc|desc] — col ∈ first_seen_at|updated_at|trips_count|name|phone (default first_seen_at:desc)' }, { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }], responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' } } }
  /passengers/lookup:
    get: { tags: [passengers], summary: 'Phone-exact passenger lookup (Bearer; any signed-in user) — used by the post-trip form to prefill the passenger name. Returns the passenger + referred_by, or 404 if no row exists for that phone.', parameters: [{ name: phone, in: query, required: true, schema: { type: string }, description: 'E.164, matched exactly' }], responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' }, '404': { $ref: '#/components/responses/Envelope' }, '422': { $ref: '#/components/responses/Envelope' } } }
