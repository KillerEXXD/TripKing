openapi: 3.0.3
info:
  title: TripKing API
  version: 0.1.0
  description: >
    Outstation cab marketplace REST API. Wire format is snake_case; every response uses the
    envelope `{ success, data, meta?, error }` (meta on lists, error non-null on failure).
    This document currently covers the `/admin/*` master-data endpoints (Phase 2); the
    marketplace endpoints (`/auth`, `/trips`, `/drivers`, `/vacancies`, …) follow in Phase 3.
servers:
  - url: https://api.tripking.in
tags:
  - name: admin
    description: Administration master-data (the configurable lookup tables — see §7 of the spec).
  - name: auth
    description: Phone-OTP authentication.
  - name: trips
    description: Trip lifecycle.
  - name: notifications
    description: In-app inbox.
  - name: vehicles
    description: Driver vehicles.
  - name: drivers
    description: Driver profiles + the "create my driver/agent profile" route.
  - name: agents
    description: Agent (trip-manager) profiles.
  - name: vacancies
    description: Driver availability posts (driver is in city X, willing to drive to one of these destinations).
  - name: alerts
    description: Saved searches that fire a notification on a matching trip/vacancy (owner-scoped).
  - name: vacancy-invitations
    description: An agent invites a vacancy-posting driver to one of their open trips; the driver accepts (inserts a trip_acceptances row — the PII reveal gate) or declines.
  - name: reviews
    description: Post-trip ratings (passenger→driver, manager→driver, driver→manager).
  - name: analytics
    description: Server-computed analytics — the platform dashboard (admin), per-agent analytics, and the API-metrics rollup (admin).
  - name: video-verifications
    description: Driver/manager video-call verification — slot booking, the call record, and the admin finalize.
  - name: places
    description: Maps-backed locations — a server-side geocoder proxy (search) and find-or-create for a `places` row.
  - name: debug
    description: Admin-only deliberate-failure endpoints — exercise the exception pipeline (front end / edge functions → Sentry). Safe to leave deployed. See `docs/EXCEPTION_HANDLING.md`.
  - name: passengers
    description: Passenger directory — one row per passenger phone seen on a trip. Read-only API; the canonical row is upserted by the `trips` POST handler (migration 019). Admin reads the full list; any authenticated user can do a phone-exact lookup to prefill the post-trip form.
  - name: bug-reports
    description: Bug tracker. Submission is gated by `users.can_report_bugs` (admins always allowed); admins manage status / comments / attachments. Storage bucket `bug-attachments` is private (signed UPLOAD/DOWNLOAD URLs only). Notification fan-out — every admin gets a `bug_reported` on create; the reporter gets `bug_resolved` on transition to resolved; comments mirror-notify the other party.
components:
  schemas:
    ApiError:
      type: object
      description: >-
        Returned inside the envelope's `error` on any non-2xx response. Every error —
        including unhandled exceptions — is delivered in this shape; an unhandled
        exception yields `{ code: "INTERNAL" }` with status 500 (never a raw runtime error)
        and is reported to Sentry (`source=edge-fn`).
      properties:
        code:
          type: string
          description: >-
            Machine-readable code. Standard values: VALIDATION (400/422), UNAUTHORIZED (401),
            FORBIDDEN (403), NOT_FOUND (404), CONFLICT (409), RATE_LIMITED (429), DB_ERROR (4xx),
            INTERNAL (500). Some endpoints add specific codes (e.g. INVALID_OTP, BAD_JSON).
        message: { type: string }
    Envelope:
      type: object
      properties:
        success: { type: boolean }
        data: {}
        meta:
          type: object
          nullable: true
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiError'
  parameters:
    list:
      name: list
      in: path
      required: true
      description: Which master-data list.
      schema:
        type: string
        enum: [car-types, fuel-types, vehicle-makes, vehicle-models, seat-options, cities, languages, review-tags, cancel-reasons]
    id:
      name: id
      in: path
      required: true
      description: Row key — uuid for most lists, the `value` int for seat-options, the BCP-47 `code` for languages.
      schema: { type: string }
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Supabase access token from `POST /auth/verify-otp`. Authenticated endpoints validate it;
        every mutating `/admin/*` call additionally requires `users.role === 'admin'`.
  responses:
    Envelope:
      description: Standard envelope response.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
paths:
  /admin/{list}:
    get:
      tags: [admin]
      summary: List a master-data list (active rows by default)
      parameters:
        - $ref: '#/components/parameters/list'
        - { name: include_inactive, in: query, schema: { type: boolean }, description: include soft-disabled rows (admin view) }
        - { name: make_id, in: query, schema: { type: string }, description: 'vehicle-models only — filter to a make' }
        - { name: category, in: query, schema: { type: string }, description: 'review-tags only — filter to a vocabulary' }
        - { name: applies_to, in: query, schema: { type: string }, description: 'cancel-reasons only' }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
    post:
      tags: [admin]
      summary: Create a row
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/list' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: the row's columns (snake_case) }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '409': { $ref: '#/components/responses/Envelope' }
        '422': { $ref: '#/components/responses/Envelope' }
        '403': { $ref: '#/components/responses/Envelope' }
  /admin/{list}/{id}:
    patch:
      tags: [admin]
      summary: Update a row (partial; include `is_active` to enable/disable)
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/list' }, { $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '404': { $ref: '#/components/responses/Envelope' }
        '409': { $ref: '#/components/responses/Envelope' }
        '422': { $ref: '#/components/responses/Envelope' }
    delete:
      tags: [admin]
      summary: Delete a row — 409 `IN_USE` if it is referenced (disable it instead)
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/list' }, { $ref: '#/components/parameters/id' }]
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '404': { $ref: '#/components/responses/Envelope' }
        '409': { $ref: '#/components/responses/Envelope' }
  /admin/{list}/reorder:
    patch:
      tags: [admin]
      summary: Reorder a list — sets `sort_order = (index + 1) * 10`
      security: [{ BearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/list' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '400': { $ref: '#/components/responses/Envelope' }
  /admin/app-settings:
    get:
      tags: [admin]
      summary: Get the single-row platform config
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
    put:
      tags: [admin]
      summary: Update the platform config (partial)
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                min_vehicle_year: { type: integer }
                vehicle_expiry_warning_days: { type: integer }
                default_alert_radius_km: { type: integer }
                default_commission_pct: { type: number }
                default_gst_pct: { type: number, description: a percentage }
                default_driver_bata: { type: number, description: flat ₹ amount }
                default_extras_paid_by_passenger: { type: boolean }
                default_driver_instructions: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Envelope' }
        '422': { $ref: '#/components/responses/Envelope' }
  /admin/places:
    get: { tags: [admin], summary: 'Browse the geocoded places — admin tool for curating the `places` table (incl. inactive). Filters: city_id, provider, q (name ilike), active (true|false), limit.', security: [{ BearerAuth: [] }], parameters: [{ name: city_id, in: query, schema: { type: string } }, { name: provider, in: query, schema: { type: string } }, { name: q, in: query, schema: { type: string } }, { name: active, in: query, schema: { type: string, enum: ['true', 'false'] } }, { name: limit, in: query, schema: { type: integer } }], responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' } } }
  /admin/places/{id}:
    patch: { tags: [admin], summary: 'Edit a place (admin) — is_active / city_id / name / formatted_address / state. Deactivate (is_active=false) instead of deleting if it''s referenced.', security: [{ BearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/id' }], requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { is_active: { type: boolean }, city_id: { type: string }, name: { type: string }, formatted_address: { type: string }, state: { type: string } } } } } }, responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' }, '404': { $ref: '#/components/responses/Envelope' }, '422': { $ref: '#/components/responses/Envelope' } } }
    delete: { tags: [admin], summary: 'Delete a place (admin) — 409 IN_USE if any *_place_id FK references it (deactivate or merge it instead).', security: [{ BearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' }, '404': { $ref: '#/components/responses/Envelope' }, '409': { $ref: '#/components/responses/Envelope' } } }
  /admin/places/{id}/merge:
    post: { tags: [admin], summary: 'Merge (dedupe) — repoint every *_place_id FK from {id} (the loser) to {into} (the winner), then delete {id}. Atomic. Returns { merged, into, fk_rows_repointed }.', security: [{ BearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/id' }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [into], properties: { into: { type: string, description: 'the place id to keep' } } } } } }, responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' }, '404': { $ref: '#/components/responses/Envelope' }, '422': { $ref: '#/components/responses/Envelope' } } }
  /admin/users:
    get: { tags: [admin], summary: 'List user accounts (admin) — filter by role / active / q (phone|email|display_name ilike); limit (default 100, max 500), newest first.', security: [{ BearerAuth: [] }], parameters: [{ name: role, in: query, schema: { type: string, enum: [driver, trip_manager, admin] } }, { name: active, in: query, schema: { type: string, enum: ['true', 'false'] } }, { name: q, in: query, schema: { type: string } }, { name: limit, in: query, schema: { type: integer } }], responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' } } }
  /admin/users/{id}:
    get: { tags: [admin], summary: 'Get a user account (admin).', security: [{ BearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' }, '404': { $ref: '#/components/responses/Envelope' } } }
    patch: { tags: [admin], summary: 'Update a user account (admin) — { is_active?, role?, display_name?, can_report_bugs?, reason? }. can_report_bugs flips the per-user gate that lets the user submit /bug-reports (admins are always allowed regardless of the flag). is_active is the ACCOUNT-level kill switch: when false the account can''t get a new session (/auth verify-otp & refresh → 403) and gets an account_status_change notification; this is distinct from PATCH /drivers|/agents/{id}/active, which only deactivates the marketplace *profile* (the user can still sign in & see a "suspended" banner). role grants/revokes administrator (or driver / trip_manager). You cannot deactivate or demote your own account (422). Audit-logged with the actor''s id (+ the reason).', security: [{ BearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/id' }], requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { is_active: { type: boolean }, role: { type: string, enum: [driver, trip_manager, admin] }, display_name: { type: string }, can_report_bugs: { type: boolean, description: 'gate for /bug-reports submission (admins always allowed)' }, reason: { type: string, description: 'shown to the user when suspending; recorded in the audit log' } } } } } }, responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' }, '404': { $ref: '#/components/responses/Envelope' }, '422': { $ref: '#/components/responses/Envelope' } } }
  /auth/request-otp:
    post: { tags: [auth], summary: 'Request an SMS OTP — PLACEHOLDER (no SMS provider yet): always succeeds and returns the dev OTP "12345" in dev_otp', requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone], properties: { phone: { type: string } } } } } }, responses: { '200': { $ref: '#/components/responses/Envelope' } } }
  /auth/verify-otp:
    post: { tags: [auth], summary: 'Verify an OTP → { user, access_token, refresh_token } (dev: accepts "12345" or any 4–6 digit code). Self-signup as role:admin is honoured only when TRIPKING_DEV_MODE is unset/"true" (the default); in production it''s rejected with 403 — admins are provisioned via PATCH /admin/users/{id}. 403 ACCOUNT_SUSPENDED if users.is_active = false (the account-level kill switch — an admin flipped it; orthogonal to KYC).', requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone, otp], properties: { phone: { type: string }, otp: { type: string }, display_name: { type: string }, role: { type: string, enum: [driver, trip_manager, admin] } } } } } }, responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' } } }
  /auth/refresh:
    post: { tags: [auth], summary: 'Exchange a refresh token for a new pair. 403 ACCOUNT_SUSPENDED if users.is_active = false (a suspended account loses access on its next refresh).', requestBody: { required: true, content: { application/json: { schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } } } } }, responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' } } }
  /auth/logout:
    post: { tags: [auth], summary: 'Best-effort server logout (Bearer)', responses: { '200': { $ref: '#/components/responses/Envelope' } } }
  /auth/me:
    get: { tags: [auth], summary: 'The current user (Bearer)', responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' } } }
  /trips:
    get: { tags: [trips], summary: 'List trips (Bearer required). Each trip is redacted to the caller''s relationship: rows you posted → full (passenger name+phone, poster phone, the assigned driver''s live position, distance_to_destination_km, passenger_otp); rows assigned to your driver profile → passenger name + poster phone + your own live position (passenger phone only when the trip''s hide_passenger_phone is false); everything else → browse-safe (route/fare/car-type/pickup/passenger_count/applicant_count/posted_by_name/from_place/to_place — no passenger PII, no driver positions). status=in_progress&posted_by_user_id=<me> is a trip manager''s live-trips map; assigned_driver_id=me is "the trips I''m driving". near_lat+near_lng+radius_km (all three; radius capped at 100km) restricts to trips whose pickup point (from_place → from_city fallback) is within range, nearest first, each row carrying distance_km.', parameters: [{ name: status, in: query, schema: { type: string }, description: 'one value or a CSV (e.g. open,has_applicants)' }, { name: from_city_id, in: query, schema: { type: string } }, { name: to_city_id, in: query, schema: { type: string } }, { name: via_city_id, in: query, schema: { type: string }, description: 'trips whose waypoint chain contains this city anywhere (origin / stop / destination) — migration 024' }, { name: posted_by_user_id, in: query, schema: { type: string } }, { name: assigned_driver_id, in: query, schema: { type: string }, description: 'a driver uuid, or the literal "me" — resolves to the caller''s driver profile (the trips assigned to you)' }, { name: near_lat, in: query, schema: { type: number } }, { name: near_lng, in: query, schema: { type: number } }, { name: radius_km, in: query, schema: { type: number, maximum: 100 }, description: 'radius search — all three of near_lat/near_lng/radius_km must be present' }, { name: limit, in: query, schema: { type: integer } }], responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' } } }
    post: { tags: [trips], summary: 'Post a trip (Bearer; the poster must be is_active + KYC-verified — 403 ACCOUNT_SUSPENDED if the driver/agent profile is deactivated, 403 KYC_REQUIRED if not yet approved) — hide_passenger_phone (true|false) and passenger_count (≥1) are REQUIRED. Two body shapes accepted: (a) legacy single-leg (from_city_id + to_city_id, optional from_place_id / to_place_id — server synthesises a 2-waypoint one_way plan), OR (b) migration-024 shape with trip_type + waypoints[] (one_way / round_trip / multi_way). Round_trip last waypoint city/place must match the first; multi_way can either drop (last ≠ first) or loop back (last == first) — the client labels these as "Multi-way drop" / "Multi-way return back" in share text. expected_end_at must be > pickup_at and ≤ app_settings.max_trip_duration_days. driver_bata is per-day; driver_payout = (fare − commission − GST) + driver_bata × ceil(days) + wait_charges. Per-user rate-limited (429 RATE_LIMITED on excess).', requestBody: { required: true, content: { application/json: { schema: { type: object, required: [pickup_at, car_type_id, expected_distance_km, rate_per_km, hide_passenger_phone, passenger_count], properties: { hide_passenger_phone: { type: boolean, description: 'whether to hide the passenger phone from the assigned driver (the poster always sees it)' }, passenger_count: { type: integer, minimum: 1 }, from_city_id: { type: string, description: 'required when waypoints[] is omitted' }, to_city_id: { type: string, description: 'required when waypoints[] is omitted' }, from_place_id: { type: string }, to_place_id: { type: string }, trip_type: { type: string, enum: [one_way, round_trip, multi_way], description: 'route shape; defaults to one_way' }, expected_end_at: { type: string, description: 'ISO timestamp; trip end (must be > pickup_at, span ≤ max_trip_duration_days). Server defaults to last-waypoint arrive_at + wait, or pickup_at + 1 day.' }, waypoints: { type: array, description: 'Ordered list (origin → 0+ stops → final). For round_trip the last city/place must equal the first; for multi_way ≥3 entries and last can match or differ from first (drop vs return back).', items: { type: object, properties: { city_id: { type: string }, place_id: { type: string }, arrive_at: { type: string, description: 'ISO timestamp; monotonic vs the previous waypoint and pickup_at' }, wait_minutes: { type: integer, minimum: 0 }, is_destination: { type: boolean }, notes: { type: string, description: 'free text; rejected if it contains a phone number' } } } } } } } } }, responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' }, '422': { $ref: '#/components/responses/Envelope' }, '429': { $ref: '#/components/responses/Envelope' } } }
  /trips/applied:
    get: { tags: [trips], summary: 'My applications (driver; Bearer) — the caller''s own trip_acceptances, newest first, each with its joined trip (from/to city, car type). The poster-only GET /trips/{id}/applicants is for the other side; this is the driver''s view of where they''ve applied. Empty array if the caller has no driver profile.', responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' } } }
  /trips/by-otp/{otp}:
    get: { tags: [trips], summary: 'Get the trip for a passenger OTP (public — the OTP is the credential; the passenger portal). The passenger''s own view: their data + the assigned driver (with live position + phone, to track/reach the ride) + vehicle; distance_to_destination_km when in_progress; fare fields nulled when show_fare_to_passenger is false; passenger_otp_hash / passenger_otp never echoed.', parameters: [{ name: otp, in: path, required: true, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Envelope' }, '404': { $ref: '#/components/responses/Envelope' } } }
  /trips/{id}:
    get: { tags: [trips], summary: 'Get a trip (Bearer required) — redacted to the caller''s relationship: the poster (or an admin) sees passenger name+phone, poster phone, the assigned driver''s live position, distance_to_destination_km, and the plaintext passenger_otp (so they can re-open the passenger-portal link); the assigned driver sees passenger name + poster phone + their own live position (and passenger phone ONLY when the trip''s hide_passenger_phone is false; never the OTP); anyone else sees browse-safe fields only (no passenger PII, no driver position). passenger_otp_hash is never returned.', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' }, '404': { $ref: '#/components/responses/Envelope' } } }
  /trips/{id}/applicants:
    get: { tags: [trips], summary: 'List applicants (poster/admin; Bearer)', parameters: [{ $ref: '#/components/parameters/id' }], responses: { '200': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' } } }
    post: { tags: [trips], summary: 'Apply to a trip (driver; Bearer; must be is_active + KYC-verified — 403 ACCOUNT_SUSPENDED if the driver is deactivated, 403 KYC_REQUIRED if not yet approved) — per-user rate-limited (429 RATE_LIMITED on excess)', parameters: [{ $ref: '#/components/parameters/id' }], requestBody: { content: { application/json: { schema: { type: object, properties: { vehicle_id: { type: string }, applicant_quoted_rate_per_km: { type: number }, applicant_message: { type: string } } } } } }, responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' }, '409': { $ref: '#/components/responses/Envelope' }, '429': { $ref: '#/components/responses/Envelope' } } }
  /trips/{id}/applicants/{aid}:
    delete: { tags: [trips], summary: 'Withdraw an application (owning driver/admin; Bearer)', parameters: [{ $ref: '#/components/parameters/id' }, { name: aid, in: path, required: true, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Envelope' } } }
  /trips/{id}/applicants/{aid}/reject:
    post: { tags: [trips], summary: 'Reject an applicant (poster/admin; Bearer)', parameters: [{ $ref: '#/components/parameters/id' }, { name: aid, in: path, required: true, schema: { type: string } }], responses: { '200': { $ref: '#/components/responses/Envelope' } } }
  /trips/{id}/assign:
    post: { tags: [trips], summary: 'Assign a driver (poster/admin; Bearer) — selects one acceptance, rejects the rest, generates the passenger OTP. 422 if the chosen acceptance''s driver has been deactivated (pick another applicant).', parameters: [{ $ref: '#/components/parameters/id' }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [acceptance_id], properties: { acceptance_id: { type: string } } } } } }, responses: { '200': { $ref: '#/components/responses/Envelope' }, '403': { $ref: '#/components/responses/Envelope' }, '422': { $ref: '#/components/responses/Envelope' } } }
  /trips/{id}/start:
    post: { tags: [trips], summary: 'Start the trip (assigned driver/admin; Bearer) — verifies the passenger OTP → in_progress', parameters: [{ $ref: '#/components/parameters/id' }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [passenger_otp], properties: { passenger_otp: { type: string }, start_odo_url: { type: string }, start_odo_reading: { type: integer } } } } } }, responses: { '200': { $ref: '#/components/responses/Envelope' }, '401': { $ref: '#/components/responses/Envelope' }, '409': { $ref: '#/components/responses/Envelope' } } }
  /trips/{id}/complete:
